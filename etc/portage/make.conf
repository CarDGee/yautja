########################################################################    

DEVIRTLTO="-fdevirtualize-at-ltrans"
GRAPHITE="-fgraphite-identity -floop-nest-optimize"
IPAPTA="-fipa-pta"
LTO="-flto=24 -fuse-linker-plugin -fno-fat-lto-objects"
SEMINTERPOS="-fno-semantic-interposition"

#COMMON_FLAGS="-march=native -mtune=native -O2 -pipe -fomit-frame-pointer -ftree-vectorize"
COMMON_FLAGS="-march=native -mtune=native -O3 -pipe -fomit-frame-pointer -ftree-vectorize ${GRAPHITE} ${DEVIRTLTO} ${LTO}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-fuse-ld=mold -Wl,-O2 -Wl,--as-needed ${SEMINTERPOS}"
#LDFLAGS="-Wl,-O1 -Wl,--as-needed"

CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

MAKEOPTS="-j24 -l24"

ACCEPT_KEYWORDS="amd64"

FEATURES="buildpkg candy clean-logs parallel-fetch parallel-install"
EMERGE_DEFAULT_OPTS="--jobs=3 --load-average=24 --ask --autounmask-write=y --keep-going=y --with-bdeps=y"
ACCEPT_LICENSE="*" 
PORTAGE_NICENESS=19
AUTOCLEAN="yes"

BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="--rm --long --threads=1 --adapt=min=7,max=19"

LINGUAS="en en_GB pt pt_PT"
L10N="en en-GB pt pt-PT"

INPUT_DEVICES="libinput"
SANE_BACKENDS="hp"
VIDEO_CARDS="intel iris nvidia"


USE_ENABLED="acpi branding cet cryptsetup dbus flatpak fuse jit lm-sensors lto pgo policykit polly udev udisks upower unwind zip zram zstd"
USE_DISABLED="-X -bindist -doc -gnome -gnome-keyring -gtk2 -handbook -man -qt4 -qt5 -vte"
#CODECS=""
MEDIA="cuda ffmpeg jack nvenc vaapi vdpau vulkan wayland"
USE="${USE_ENABLED} ${USE_DISABLED} ${CODECS} ${MEDIA}"

# NOTE: This stage was built with the bindist Use flag enabled
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C

##Rust
RUSTFLAGS="-C opt-level=3 -C target-cpu=native -C link-arg=-fuse-ld=mold"

##TARGETS

##Grub
GRUB_PLATFORMS="efi-64 pc"

GENTOO_MIRRORS="https://mirror.bytemark.co.uk/gentoo/ ftp://mirror.bytemark.co.uk/gentoo/ https://ftp.rnl.tecnico.ulisboa.pt/pub/gentoo/gentoo-distfiles/ ftp://ftp.rnl.tecnico.ulisboa.pt/pub/gentoo/gentoo-distfiles/"
